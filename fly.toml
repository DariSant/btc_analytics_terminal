app = "btc-analytics-terminal"
primary_region = "fra"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  SQLITE_PATH = "/data/terminal.db"
  WHALE_MIN_USD = "250000"
  LIQ_MIN_USD = "25000"
  RETENTION_DAYS = "14"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/api/v1/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source = "btc_terminal_data"
  destination = "/data"
